<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        var ua = navigator.userAgent;
        if (/android/i.test(ua)) {
            window.location.href = "https://play.google.com/store/apps/details?id=com.carafestudios.toggle";
        } else {
            window.location.href = "https://apps.apple.com/us/app/toggle-the-game/id6461164759";
        }
    </script>
</head>
<body>
    <p>Redirecting to the app store...</p>
</body>
</html>
